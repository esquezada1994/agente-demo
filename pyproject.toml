[project]
name = "agente"
version = "0.1.0"
description = "Agente de cobranza preventiva: producto independiente, gobernado con plataforma-sdk"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "cryptography>=43",
    "typer>=0.15",
    # Motor del agente. LangGraph ejecuta el grafo; langchain-core da la
    # interfaz común de modelos y herramientas (cualquier proveedor).
    "langgraph>=1.2,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    # Gobierno: trazas, manifiesto, valor y valoración hacia el portal.
    "plataforma-sdk>=0.2",
    "email-validator>=2.2",
]

[project.scripts]
agente = "agente.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv.sources]
# Mientras el SDK no esté publicado (PyPI o GitHub Packages) se usa la rueda
# construida desde el repositorio del portal: `make vendor-sdk`.
plataforma-sdk = { path = "vendor/plataforma_sdk-0.2.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agente"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
# E501: el formateador decide el largo de línea (los textos largos se dejan).
# RUF012: falso positivo con campos de Pydantic y SQLAlchemy.
ignore = ["S101", "RUF001", "RUF002", "RUF003", "E501", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
